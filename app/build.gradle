plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xpocketmp.manager'
    compileSdk 34

    defaultConfig {
        applicationId "com.xpocketmp.manager"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'com.github.nbsp:material-file-picker:1.9.1'  // File picker library
    implementation 'com.termux:termux-shared:0.114'  // Termux shared library for running commands
    implementation 'com.android.support:appcompat-v7:28.0.0'  // AppCompat for backward compatibility
    implementation 'com.google.android.material:material:1.4.0'  // Material design components
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'  // Lifecycle components for managing app state
    implementation 'androidx.constraintlayout:constraintlayout:2.1.1'  // ConstraintLayout for flexible layouts
    implementation 'androidx.recyclerview:recyclerview:1.2.1'  // RecyclerView for list-based UI elements
}
